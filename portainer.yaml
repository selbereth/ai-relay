# Portainer stack for Unraid. Set these in the stack's environment variables:
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#   LOGIN_PASSWORD
# Optional: put it behind HTTPS (reverse proxy / tunnel) before using it outside your LAN.
services:
  ai-relay:
    image: ghcr.io/selbereth/watch-claude:latest
    container_name: ai-relay
    restart: unless-stopped
    ports:
      - "8012:8000"
    environment:
      TZ: America/Los_Angeles
      PUID: 99
      PGID: 100
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      LOGIN_USER: ${LOGIN_USER:-me}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD}
    volumes:
      - /mnt/user/appdata/ai-relay:/data
